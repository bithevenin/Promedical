<ion-content [fullscreen]="true" class="login-content--custom bg-medical-dark overflow-hidden">
  <div class="auth-wrapper min-h-screen flex items-center justify-center p-6 relative font-inter bg-medical-dark selection:bg-primary selection:text-white">
    
    <!-- Background Elements -->
    <div class="absolute inset-0 pointer-events-none overflow-hidden">
       <div class="absolute -top-24 -left-24 w-[30rem] h-[30rem] bg-primary/20 blur-[150px] rounded-full animate-pulse-slow"></div>
       <div class="absolute top-[20%] -right-24 w-[25rem] h-[25rem] bg-emerald-500/10 blur-[150px] rounded-full"></div>
       <div class="absolute -bottom-24 left-[10%] w-[20rem] h-[20rem] bg-sky-500/10 blur-[120px] rounded-full"></div>
       <div class="absolute inset-x-0 bottom-0 h-64 bg-gradient-to-t from-dark-deep to-transparent opacity-50"></div>
       <div class="absolute inset-0 bg-[url('data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E')] opacity-20 mix-blend-overlay"></div>
    </div>

    <div class="auth-card w-full max-w-md bg-slate-800/95 border border-slate-700/50 rounded-[3.5rem] p-10 lg:p-14 shadow-2xl relative z-10 animate-fade-in-up transition-all duration-700">
        
        <div class="brand-section text-center mb-12">
            <div class="logo-icon w-20 h-20 bg-primary rounded-[2rem] flex items-center justify-center text-white text-4xl shadow-2xl shadow-primary/30 mx-auto mb-8 animate-bounce-in ring-8 ring-primary/10">
                <ion-icon name="pulse-outline"></ion-icon>
            </div>
            <h1 class="text-3xl lg:text-4xl font-black text-white tracking-tighter uppercase mb-2">ProMedical</h1>
            <p class="text-[10px] font-black uppercase text-text-muted tracking-[0.4em]">Advanced Clinical Core</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="space-y-6">
            <div class="form-group space-y-2">
                <label class="text-[9px] font-black text-text-muted uppercase tracking-[0.2em] ml-2">Identidad Digital</label>
                <div class="relative group">
                    <ion-icon name="mail-outline" class="absolute left-5 top-1/2 -translate-y-1/2 text-primary opacity-50 text-lg"></ion-icon>
                    <input type="email" formControlName="email" placeholder="usuario@promedical.com"
                        class="w-full bg-white/5 border border-glass-border rounded-2xl pl-12 pr-6 py-4 text-[11px] font-black text-white focus:outline-none focus:border-primary/50 transition-all">
                </div>
            </div>

            <div class="form-group space-y-2">
                <div class="flex items-center justify-between px-2">
                   <label class="text-[9px] font-black text-text-muted uppercase tracking-[0.2em]">Clave de Acceso</label>
                </div>
                <div class="relative group">
                    <ion-icon name="lock-closed-outline" class="absolute left-5 top-1/2 -translate-y-1/2 text-primary opacity-50 text-lg"></ion-icon>
                    <input type="password" formControlName="password" placeholder="••••••••"
                        class="w-full bg-white/5 border border-glass-border rounded-2xl pl-12 pr-6 py-4 text-[11px] font-black text-white focus:outline-none focus:border-primary/50 transition-all tracking-[0.3em]">
                </div>
            </div>
            
            <div class="pt-2">
              <button type="submit" [disabled]="loginForm.invalid || isLoading"
                  class="w-full py-4 bg-primary text-white font-black text-[10px] uppercase tracking-[0.3em] rounded-2xl shadow-xl shadow-primary/20 hover:bg-primary-deep active:scale-95 disabled:opacity-30 transition-all flex items-center justify-center gap-2 cursor-pointer">
                  <span *ngIf="!isLoading">Entrar al Sistema</span>
                  <span *ngIf="isLoading">Iniciando sesión...</span>
                  <ion-icon [name]="isLoading ? 'sync' : 'arrow-forward'" [class.animate-spin]="isLoading"></ion-icon>
              </button>
            </div>

            <div class="flex flex-col gap-4 text-center">
              <a routerLink="/auth/forgot-password" class="text-[8px] font-black text-text-muted uppercase tracking-widest hover:text-primary transition-colors">¿Olvidaste tu contraseña? Recupérala aquí</a>
              <div class="h-px bg-glass-border/30 w-1/3 mx-auto"></div>
              <p class="text-[9px] font-bold text-text-muted">¿Eres nuevo profesional? 
                <a routerLink="/register" class="text-primary font-black uppercase tracking-tight ml-1 hover:underline">Registrar Consultorio</a>
              </p>
            </div>
        </form>

        <footer class="mt-10 text-center">
           <p class="text-[8px] font-black text-text-muted uppercase tracking-[0.3em] opacity-30">PROMEDICAL CLINICAL CORE • v2.1.0</p>
        </footer>
    </div>
  </div>
</ion-content>
