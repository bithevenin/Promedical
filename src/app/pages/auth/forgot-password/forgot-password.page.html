<ion-content [fullscreen]="true" class="login-content--custom bg-medical-dark overflow-hidden">
  <div class="auth-wrapper min-h-screen flex items-center justify-center p-6 relative font-inter bg-medical-dark selection:bg-primary selection:text-white">
    
    <!-- Background Elements -->
    <div class="absolute inset-0 pointer-events-none overflow-hidden">
       <div class="absolute -top-24 -left-24 w-[30rem] h-[30rem] bg-indigo-500/10 blur-[150px] rounded-full animate-pulse-slow"></div>
       <div class="absolute top-[20%] -right-24 w-[25rem] h-[25rem] bg-primary/20 blur-[150px] rounded-full"></div>
       <div class="absolute -bottom-24 left-[10%] w-[20rem] h-[20rem] bg-emerald-500/10 blur-[120px] rounded-full"></div>
       <div class="absolute inset-0 bg-[url('data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E')] opacity-20 mix-blend-overlay"></div>
    </div>

    <div class="auth-card w-full max-w-md bg-glass-light hover:bg-glass-heavy backdrop-blur-3xl border border-glass-border rounded-[3.5rem] p-10 lg:p-14 shadow-2xl relative z-10 animate-fade-in-up transition-all duration-700">
        
        <div class="brand-section text-center mb-12">
            <div class="logo-icon w-20 h-20 bg-indigo-500 rounded-[2rem] flex items-center justify-center text-white text-4xl shadow-2xl shadow-indigo-500/30 mx-auto mb-8 animate-bounce-in ring-8 ring-indigo-500/10">
                <ion-icon name="key-outline"></ion-icon>
            </div>
            <h1 class="text-3xl lg:text-4xl font-black text-white tracking-tighter uppercase mb-2 leading-none">Recuperar</h1>
            <p class="text-[10px] font-black uppercase text-text-muted tracking-[0.4em] mb-1">Acceso Clínico</p>
        </div>

        <form [formGroup]="resetForm" (ngSubmit)="onReset()" class="space-y-8">
            <div class="form-group space-y-3">
                <label class="text-[10px] font-black text-text-muted uppercase tracking-[0.2em] ml-2">E-mail Registrado</label>
                <div class="input-wrapper relative group">
                    <div class="absolute left-6 top-1/2 -translate-y-1/2 text-indigo-400 opacity-50 group-focus-within:opacity-100 transition-opacity">
                       <ion-icon name="mail-outline" class="text-xl"></ion-icon>
                    </div>
                    <input
                        type="email"
                        formControlName="email"
                        placeholder="id@promedical.com"
                        class="w-full bg-white/5 border border-glass-border rounded-[1.5rem] pl-14 pr-6 py-5 text-sm font-black text-white placeholder:text-text-muted/50 focus:outline-none focus:border-indigo-500/50 focus:ring-4 focus:ring-indigo-500/10 transition-all font-inter"
                    >
                </div>
            </div>

            <!-- Area de mensajes -->
            <div *ngIf="message" class="p-6 bg-emerald-500/10 border border-emerald-500/20 rounded-3xl animate-bounce-in flex items-start gap-4">
                <ion-icon name="checkmark-circle" class="text-emerald-500 text-2xl shrink-0"></ion-icon>
                <p class="text-[10px] font-black text-emerald-500 uppercase tracking-widest leading-relaxed">{{ message }}</p>
            </div>
            
            <div class="flex items-center justify-center">
                <a routerLink="/auth/login" class="text-[10px] font-black text-text-secondary uppercase tracking-[0.2em] hover:text-white transition-all flex items-center gap-2 group">
                   <ion-icon name="arrow-back-outline" class="text-lg group-hover:-translate-x-1 transition-transform"></ion-icon>
                   Retornar al Acceso
                </a>
            </div>

            <div class="pt-2">
              <button
                  type="submit"
                  class="w-full py-6 bg-indigo-500 text-white font-black text-[11px] uppercase tracking-[0.3em] rounded-[2rem] shadow-xl shadow-indigo-500/20 hover:bg-indigo-600 hover:shadow-indigo-500/30 active:scale-95 disabled:opacity-30 disabled:pointer-events-none transition-all flex items-center justify-center gap-3 overflow-hidden relative group"
                  [disabled]="resetForm.invalid || isLoading"
              >
                  <span *ngIf="!isLoading" class="relative z-10">Transmitir Enlace</span>
                  <ion-icon name="send-outline" *ngIf="!isLoading" class="text-lg animate-pulse relative z-10"></ion-icon>
                  <ion-spinner name="crescent" *ngIf="isLoading" color="light"></ion-spinner>
                  <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full group-hover:animate-shimmer"></div>
              </button>
            </div>

        </form>

        <footer class="mt-12 text-center">
           <p class="text-[9px] font-black text-text-muted uppercase tracking-widest opacity-50">Secure Recovery Protocol • v2.0.4</p>
        </footer>
    </div>
  </div>
</ion-content>
