<ion-content [fullscreen]="true" class="login-content">
  <div class="auth-wrapper">
    <div class="background-decor">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
    </div>

    <div class="auth-card animate__animated animate__fadeInUp">
        <div class="brand-section">
            <div class="logo-icon">
                <ion-icon name="lock-open-outline"></ion-icon>
            </div>
            <h1>Recuperar Acceso</h1>
            <p>Ingresa tu correo para restablecer tu contraseña</p>
        </div>

        <form [formGroup]="resetForm" (ngSubmit)="onReset()">
            <div class="form-group">
                <label>Correo Electrónico</label>
                <div class="input-wrapper">
                    <ion-icon name="mail-outline"></ion-icon>
                    <input
                        type="email"
                        formControlName="email"
                        placeholder="ejemplo@correo.com"
                    >
                </div>
            </div>

            <!-- Area de mensajes idéntica a la estructura de form-group o utilidad -->
            <div *ngIf="message" class="alert alert-success small mb-3 animate__animated animate__fadeIn text-center text-white" style="background: rgba(46, 213, 115, 0.2); border: 1px solid rgba(46, 213, 115, 0.3); border-radius: 12px; padding: 10px;">
                {{ message }}
            </div>
            
            <div class="forgot-password">
                <a routerLink="/auth/login">Volver al Inicio de Sesión</a>
            </div>

            <button
                type="submit"
                class="btn-login"
                [disabled]="resetForm.invalid || isLoading"
            >
                <span *ngIf="!isLoading">Enviar Enlace</span>
                <ion-spinner name="crescent" *ngIf="isLoading"></ion-spinner>
            </button>

        </form>
    </div>
  </div>
</ion-content>
