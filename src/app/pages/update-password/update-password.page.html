<ion-content [fullscreen]="true" class="login-content">
  <div class="auth-wrapper">
    <div class="background-decor">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
    </div>

    <div class="auth-card animate__animated animate__fadeInUp">
        <div class="brand-section">
            <div class="logo-icon">
                <ion-icon name="key-outline"></ion-icon>
            </div>
            <h1>Nueva Contraseña</h1>
            <p>Ingresa y confirma tu nueva contraseña segura</p>
        </div>

        <form [formGroup]="updatePasswordForm" (ngSubmit)="onUpdatePassword()">
            
            <div class="form-group">
                <label>Nueva Contraseña</label>
                <div class="input-wrapper">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                    <input
                        type="password"
                        formControlName="password"
                        placeholder="Mínimo 8 caracteres"
                    >
                </div>
                <div class="error-msg" *ngIf="updatePasswordForm.get('password')?.touched && updatePasswordForm.get('password')?.errors?.['minlength']">
                    <small>Mínimo 8 caracteres</small>
                </div>
            </div>

            <div class="form-group">
                <label>Confirmar Contraseña</label>
                <div class="input-wrapper">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                    <input
                        type="password"
                        formControlName="confirmPassword"
                        placeholder="Repite la contraseña"
                    >
                </div>
                <div class="error-msg" *ngIf="updatePasswordForm.hasError('mismatch') && updatePasswordForm.get('confirmPassword')?.touched">
                    <small>Las contraseñas no coinciden</small>
                </div>
            </div>

            <!-- Area de mensajes simplificada -->
            <div *ngIf="message" class="alert small mb-3 animate__animated animate__fadeIn text-center text-white" 
                 [style.background]="msgType === 'success' ? 'rgba(46, 213, 115, 0.2)' : 'rgba(235, 68, 90, 0.2)'"
                 [style.border]="msgType === 'success' ? '1px solid rgba(46, 213, 115, 0.3)' : '1px solid rgba(235, 68, 90, 0.3)'"
                 style="border-radius: 12px; padding: 10px;">
                {{ message }}
            </div>
            
            <button
                type="submit"
                class="btn-login"
                [disabled]="updatePasswordForm.invalid || isLoading"
            >
                <span *ngIf="!isLoading">Actualizar Contraseña</span>
                <ion-spinner name="crescent" *ngIf="isLoading"></ion-spinner>
            </button>

            <!-- Back to Login (Optional) -->
            <div class="mt-3 text-center">
                 <a routerLink="/auth/login" class="text-decoration-none small text-muted" style="color: rgba(255,255,255,0.5);">Cancelar y volver al Login</a>
            </div>

        </form>
    </div>
  </div>
</ion-content>
